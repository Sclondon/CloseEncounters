html/head_include="<style>html,body{background:#05070f;touch-action:none;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}#status-progress{display:none!important}#ce-sky{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9}#ce-star{position:fixed;left:-99px;top:-99px;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;z-index:10;filter:drop-shadow(0 0 6px #b8ffc4) drop-shadow(0 0 14px #4f8)}#ce-star>div{width:100%;height:100%;background:#e8ffec;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:ce-spin 1.6s linear infinite}@keyframes ce-spin{to{transform:rotate(360deg)}}</style><script>window.addEventListener('DOMContentLoaded',function(){var c=document.createElement('canvas');c.id='ce-sky';document.body.appendChild(c);var g=c.getContext('2d');var S=[];for(var i=0;i<170;i++){S.push([Math.random()*2-1,Math.random()*2-1,Math.random()])}var last=performance.now();function sky(now){if(!c.isConnected){return}var dt=Math.min((now-last)/1000,0.05);last=now;if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight}var W=c.width,H=c.height,f=Math.min(W,H)*0.5;g.clearRect(0,0,W,H);var sp=0.25+1.6*(window.ceK||0);for(var i=0;i<S.length;i++){var q=S[i];var z0=q[2];q[2]-=dt*sp;if(q[2]<=0.02){q[0]=Math.random()*2-1;q[1]=Math.random()*2-1;q[2]=1;continue}var a=Math.min(1,(1-q[2])*1.4)*0.7;g.strokeStyle='rgba(220,255,230,'+a+')';g.lineWidth=Math.max(1,(1-q[2])*2.5);g.beginPath();g.moveTo(W/2+q[0]/z0*f,H/2+q[1]/z0*f);g.lineTo(W/2+q[0]/q[2]*f,H/2+q[1]/q[2]*f);g.stroke()}requestAnimationFrame(sky)}requestAnimationFrame(sky);var w=document.createElement('div');w.id='ce-star';w.appendChild(document.createElement('div'));document.body.appendChild(w);var k=0;var t=setInterval(function(){var st=document.getElementById('status');var img=document.getElementById('status-splash');var p=document.getElementById('status-progress');if(!st||!img||!document.body.contains(st)||getComputedStyle(st).display==='none'||getComputedStyle(st).visibility==='hidden'){w.remove();c.remove();clearInterval(t);return;}var want=(p&&p.max&&p.value)?p.value/p.max:0;k+=(want-k)*0.25;window.ceK=k;var r=img.getBoundingClientRect();if(r.width<2||!img.naturalWidth){return;}var s=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight,1);var dw=img.naturalWidth*s,dh=img.naturalHeight*s;var x0=r.left+(r.width-dw)/2,y0=r.top+(r.height-dh)/2;var x=x0+dw*(0.33+0.34*k);var y=y0+dh*(0.48-0.24*Math.sin(Math.PI*k));w.style.left=x+'px';w.style.top=y+'px';},50);});</script>"
